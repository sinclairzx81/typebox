name: Test
on: [push, pull_request]
jobs:
  Build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        node: [24.x]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Node
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Dependencies
      - name: Install dependencies
        run: npm ci

      # Test
      - name: Test Library
        run: npm run test

      # Build
      - name: Build Library
        run: npm run build