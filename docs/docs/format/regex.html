<h1>Format.IsRegex</h1>
<p>Returns true if the string is a regular expression</p>
<h2>Function</h2>
<pre><code class="language-typescript">import Format from &#39;typebox/format&#39;

const R = Format.IsRegex(&#39;^\\d{3}-\\d{2}-\\d{4}$&#39;)
</code></pre>
<h2>Schema</h2>
<pre><code class="language-typescript">import Schema from &#39;typebox/schema&#39;

const R = Schema.Check({ format: &#39;regex&#39; }, &#39;^\\d{3}-\\d{2}-\\d{4}$&#39;)
</code></pre>
