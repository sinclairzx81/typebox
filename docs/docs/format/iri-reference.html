<h1>Format.IsIriReference</h1>
<p>Returns true if the string is an IRI reference</p>
<h2>Function</h2>
<pre><code class="language-typescript">import Format from &#39;typebox/format&#39;

const R = Format.IsIriReference(&#39;https://예제.회사/경로&#39;)
</code></pre>
<h2>Schema</h2>
<pre><code class="language-typescript">import Schema from &#39;typebox/schema&#39;

const R = Schema.Check({ format: &#39;iri-reference&#39; }, &#39;https://예제.회사/경로&#39;)
</code></pre>
