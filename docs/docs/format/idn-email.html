<h1>Format.IsIdnEmail</h1>
<p>Returns true if the string is an internationalized <a href="https://datatracker.ietf.org/doc/html/rfc6531">RFC 6531</a> email address</p>
<h2>Function</h2>
<pre><code class="language-typescript">import Format from &#39;typebox/format&#39;

const R = Format.IsIdnEmail(&#39;사용자@예제.회사&#39;)
</code></pre>
<h2>Schema</h2>
<pre><code class="language-typescript">import Schema from &#39;typebox/schema&#39;

const R = Schema.Check({ format: &#39;idn-email&#39; }, &#39;사용자@예제.회사&#39;)
</code></pre>
